[package]
name = "dwparser"
version = "0.1.6"
edition = "2021"
authors = ["gaoqiangz <gaoqiangz@msn.com>"]
keywords = ["pb", "powerbuilder", "datawindow", "dw", "parser"]
categories = ["parsing"]
description = "DataWindow Syntax Parser"
documentation = "https://docs.rs/dwparser"
repository = "https://github.com/gaoqiangz/dwparser"
license = "BSD-2-Clause"
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src/**",
    "/examples/**",
    "/assets/**",
]

[package.metadata.docs.rs]
all-features = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nom = "7.1.1"
indexmap = { version = "2.9.0", features = ["std"], optional = true }
serde = { version = "1.0.152", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.91"

[features]
default = ["preserve_order"]
full = ["case_insensitive", "query", "serde_support"]

preserve_order = ["dep:indexmap"]
case_insensitive = []
query = []
serde_support = ["dep:serde", "indexmap/serde"]

[[example]]
name = "serde"
required-features = ["serde_support"]
